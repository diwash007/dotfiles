# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# remap prefix from 'C-b' to 'C-Space'
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# split panes using | and -
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Alt key for pane navigation
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# reload config file
bind r source-file ~/.tmux.conf

# kill pane without prompt
bind-key x kill-pane

# don't rename windows automatically
set-option -g allow-rename off

set -g history-limit 50000
set -sg escape-time 0
set -g renumber-windows on
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
# ---------------------------------------------
# DESIGN TWEAKS
# ---------------------------------------------

# clock mode
setw -g clock-mode-colour yellow

# copy mode
setw -g mode-style 'fg=black bg=red bold'

# panes
set -g pane-border-style 'fg=colour8'
set -g pane-active-border-style 'fg=colour32'
set -g pane-border-status bottom
set -g pane-border-format '─'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=blue'
set -g status-left ''
set -g status-left-length 10
set -g status-right-style 'fg=green'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

# active window: solid block, so it's unmistakably the selected one
setw -g window-status-current-style 'fg=black,bg=green,bold'
setw -g window-status-current-format ' #I:#W#F '

# inactive windows: no competing background, they just sit in the bar
setw -g window-status-style 'fg=red'
setw -g window-status-format ' #I #[fg=white]#W#[fg=yellow]#F '

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
set -g message-style 'fg=yellow bg=red bold'

# copy text with vim motion (prefix + '[')
set-window-option -g mode-keys vi
#bind -T copy-mode-vi v send-keys -X begin-selection
#bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
# Bind 'v' to begin selection (like visual mode in vim)
bind -T copy-mode-vi v send-keys -X begin-selection
# Bind 'y' to copy to the macOS system clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
# Bind mouse drag to copy to the macOS system clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

bind g display-popup -E \
  -w 90% -h 90% \
  -d "#{pane_current_path}" \
  -T " Lazygit " \
  lazygit
