# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Enable automatic window renaming
set-option -g automatic-rename on

# Set the rename format to the basename of the current path
set-option -g automatic-rename-format '#{b:pane_current_path}'

# remap prefix from 'C-b' to 'C-Space'
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# split panes using | and -
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/alexghergh/nvim-tmux-navigation
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +([^ ]*/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'

# Optional: Add bindings for when you are in Tmux copy-mode
bind-key -T copy-mode-vi 'M-h' select-pane -L
bind-key -T copy-mode-vi 'M-j' select-pane -D
bind-key -T copy-mode-vi 'M-k' select-pane -U
bind-key -T copy-mode-vi 'M-l' select-pane -R


# Alt key for pane navigation
# bind -n M-h select-pane -L
# bind -n M-j select-pane -D
# bind -n M-k select-pane -U
# bind -n M-l select-pane -R

# reload config file
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# kill pane without prompt
bind-key x kill-pane

set -g history-limit 50000
set -sg escape-time 0
set -g renumber-windows on
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
# ---------------------------------------------
# DESIGN TWEAKS
# ---------------------------------------------

# clock mode
setw -g clock-mode-colour yellow

# copy mode
setw -g mode-style 'fg=black bg=red bold'

# panes
set -g pane-border-style 'fg=colour8'
set -g pane-active-border-style 'fg=colour32'
set -g pane-border-status bottom
set -g pane-border-format '─'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=blue'
set -g status-left ''
set -g status-left-length 10
set -g status-right-style 'fg=green'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-style 'fg=red'
setw -g window-status-current-style 'fg=black,bg=green,bold'
setw -g window-status-format ' #I #[fg=white]#W#{?#{==:#{pane_current_command},agy}, 🤖,#{?#{m/r:^(bash|zsh|fish|sh)$,#{pane_current_command}},, 🏃}}#[fg=yellow]#F '
setw -g window-status-current-format ' #I:#W#{?#{==:#{pane_current_command},agy}, 🤖,#{?#{m/r:^(bash|zsh|fish|sh)$,#{pane_current_command}},, 🏃}}#F '

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
set -g message-style 'fg=yellow bg=red bold'

# copy text with vim motion (prefix + '[')
set-window-option -g mode-keys vi
#bind -T copy-mode-vi v send-keys -X begin-selection
#bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
# Bind 'v' to begin selection (like visual mode in vim)
bind -T copy-mode-vi v send-keys -X begin-selection
# Bind 'y' to copy to the macOS system clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
# Bind mouse drag to copy to the macOS system clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

bind g display-popup -E \
  -w 95% -h 95% \
  -d "#{pane_current_path}" \
  -T " Lazygit " \
  "LG_CONFIG_FILE=~/.config/lazygit/config.yml lazygit"
